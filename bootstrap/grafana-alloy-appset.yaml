apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana-alloy-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - clusters:
      selector:
        matchLabels:
          environment: dev
  # - list:
  #     elements:
  #     - cluster: ycd-rke2
  #       url: http://ycd-rke2.ycdisp.net:6443
  template:
    metadata:
      name: '{{.name}}-grafana-alloy'
    spec:
      project: default
      sources:
      - repoURL: https://grafana.github.io/helm-charts
        chart: alloy
        targetRevision: 1.13.0
        helm:
          releaseName: alloy
          valueFiles:
          - $values/grafana-alloy/{{.metadata.labels.environment}}/values/*.yaml
          valuesObject:
            extraEnv:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: CLUSTER_NAME
                value: '{{.name}}'
              - name: PROMETHEUS_REMOTE_WRITE_URL
                value: http://prom.local.lan:9090
              - name: LOKI_URL
                value: http://loki.local.lan:3100
      - repoURL: https://github.com/eingram-homelab/argocd-core-apps.git
        targetRevision: main
        ref: values
      - repoURL: https://github.com/eingram-homelab/argocd-core-apps.git
        targetRevision: main
        path: grafana-alloy/{{.metadata.labels.environment}}/manifests
      destination:
        server: '{{.server}}'
        namespace: alloy
      syncPolicy:
        automated:
          prune: true
          selfHeal: false
        syncOptions:
        - CreateNamespace=true
